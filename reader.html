<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Project Sentinel — Comic Reader</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#090d16;color:#f3f3f3;font-family:Arial,sans-serif}main{height:100dvh;display:flex;flex-direction:column}header,footer{background:#111827;padding:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}header a{color:#fff}header strong{font-size:14px}.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto}img{max-width:100%;max-height:100%;object-fit:contain;user-select:none}footer{justify-content:center;flex-wrap:wrap}button{border:1px solid #57657b;background:#1c293b;color:#fff;padding:9px 12px;border-radius:6px;cursor:pointer}button:disabled{opacity:.35}#counter{min-width:65px;text-align:center}</style></head><body><main><header><a href="library.html">← Library</a><strong id="heading">PROJECT SENTINEL</strong><button id="full">Full screen</button></header><div class="stage" id="stage"><img id="page" alt="Comic page"></div><footer><button id="prev">◀ Previous</button><span id="counter">Loading</span><button id="next">Next ▶</button><button id="minus">−</button><button id="fit">Fit</button><button id="plus">+</button></footer></main><script>
const editions={"issue1-en":["Issue #1","English"],"issue1-es":["Número 1","Español"],"issue2-en":["Issue #2: Saltwater","English"],"issue2-es":["Número 2: Saltwater","Español"]};const slug=new URLSearchParams(location.search).get('edition');const ed=editions[slug];if(!ed){document.getElementById('counter').textContent='Edition not found';throw Error('Unknown edition')}document.documentElement.lang=slug.endsWith('es')?'es':'en';document.getElementById('heading').textContent='PROJECT SENTINEL · '+ed.join(' · ');const img=document.getElementById('page'),counter=document.getElementById('counter'),stage=document.getElementById('stage');let pages=[],idx=0,zoom=1;fetch(slug+'/pages.json').then(r=>{if(!r.ok)throw Error('Missing pages');return r.json()}).then(p=>{pages=p;show()}).catch(()=>counter.textContent='Unable to load comic');function show(){img.src=slug+'/'+pages[idx];counter.textContent=(idx+1)+' / '+pages.length;document.getElementById('prev').disabled=idx===0;document.getElementById('next').disabled=idx===pages.length-1;img.style.maxWidth=zoom===1?'100%':'none';img.style.maxHeight=zoom===1?'100%':'none';img.style.width=zoom===1?'':'calc('+zoom+' * min(100vw, 70vh))'}function turn(n){if(!pages.length)return;idx=Math.max(0,Math.min(pages.length-1,idx+n));show()}document.getElementById('prev').onclick=()=>turn(-1);document.getElementById('next').onclick=()=>turn(1);document.getElementById('minus').onclick=()=>{zoom=Math.max(1,zoom-.25);show()};document.getElementById('plus').onclick=()=>{zoom=Math.min(3,zoom+.25);show()};document.getElementById('fit').onclick=()=>{zoom=1;show()};document.getElementById('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')turn(1);if(e.key==='ArrowLeft')turn(-1)});let x=0;stage.addEventListener('touchstart',e=>x=e.changedTouches[0].screenX,{passive:true});stage.addEventListener('touchend',e=>{const d=e.changedTouches[0].screenX-x;if(Math.abs(d)>60)turn(d<0?1:-1)},{passive:true});
</script></body></html>
