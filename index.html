
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Sentinel | Comic Library</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #10141d;
      color: #f4f4f4;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    header {
      padding: 55px 20px 30px;
      background: #171e2b;
      border-bottom: 2px solid #ad3434;
    }
    h1 {
      font-size: 42px;
      letter-spacing: 4px;
      margin: 0;
    }
    .subtitle {
      color: #b7becb;
      margin-top: 15px;
    }
    main {
      max-width: 950px;
      margin: 50px auto;
      padding: 0 20px;
    }
    h2 { margin-bottom: 35px; }
    .library {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 30px;
    }
    .comic {
      background: #1d2533;
      border: 1px solid #394353;
      border-radius: 12px;
      padding: 35px 25px;
      width: 300px;
    }
    .issue {
      font-size: 50px;
      font-weight: bold;
      color: #e2e5ec;
      margin: 15px 0;
    }
    .title {
      color: #b7becb;
      min-height: 25px;
    }
    a.read {
      display: block;
      margin-top: 25px;
      padding: 15px;
      background: #a62e2e;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
    a.read:hover { background: #c63b3b; }
    footer {
      padding: 30px;
      color: #929aa8;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <h1>PROJECT SENTINEL</h1>
    <p class="subtitle">THE OFFICIAL COMIC LIBRARY</p>
  </header>

  <main>
    <h2>SELECT AN ISSUE</h2>
    <div class="library">

      <div class="comic">
        <div class="issue">#01</div>
        <h3>ISSUE ONE</h3>
        <p class="title">The Beginning</p>
        <a class="read" href="index.html.html">READ ISSUE #1</a>
      </div>

      <div class="comic">
        <div class="issue">#02</div>
        <h3>ISSUE TWO</h3>
        <p class="title">Saltwater</p>
        <a class="read" href="issue2.html">READ ISSUE #2</a>
      </div>

    </div>
  </main>

  <footer>PROJECT SENTINEL</footer>
</body>
</html>
