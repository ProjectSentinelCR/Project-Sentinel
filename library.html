
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Sentinel | Comic Library</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background:
    linear-gradient(rgba(8,12,20,.35), rgba(8,12,20,.8)),
    url("sentinel-background.png.png") center center / cover fixed;
  background-color: #10141d;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
header { padding: 55px 20px 15px; }
h1 {
  font-size: clamp(28px, 5vw, 46px);
  letter-spacing: 4px;
  text-shadow: 2px 3px 8px black;
}
.subtitle { letter-spacing: 3px; color: #e0e0e0; }
.language {
  position: absolute;
  top: 18px;
  right: 20px;
  display: flex;
  gap: 8px;
}
.language button {
  padding: 9px 14px;
  background: rgba(12,18,28,.9);
  border: 1px solid #667080;
  border-radius: 6px;
  color: white;
  cursor: pointer;
}
.language button.active {
  background: #a62e2e;
  border-color: #c63b3b;
}
main { max-width: 1100px; margin: 20px auto; padding: 0 20px; }
.library {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 35px;
  margin-top: 30px;
}
.comic {
  width: 300px;
  padding: 15px;
  background: rgba(12,18,28,.85);
  border: 1px solid #667080;
  border-radius: 10px;
}
.comic img {
  width: 100%;
  height: 380px;
  object-fit: contain;
  display: block;
}
.comic h3 { margin: 15px 0 5px; }
.comic p { color: #d0d0d0; margin: 5px 0; }
.read {
  display: block;
  margin-top: 18px;
  padding: 14px;
  background: #a62e2e;
  color: white;
  text-decoration: none;
  border-radius: 6px;
  font-weight: bold;
}
.read:hover { background: #c63b3b; }
footer { padding: 35px 15px; color: #ddd; text-shadow: 1px 2px 5px black; }
@media (max-width: 650px) {
  body { background-attachment: scroll; }
  header { padding-top: 75px; }
  .comic { width: min(100%, 340px); }
  .language { top: 12px; right: 12px; }
}
</style>
</head>
<body>
<div class="language" aria-label="Select language">
  <button id="en" class="active" onclick="setLanguage('en')">English</button>
  <button id="es" onclick="setLanguage('es')">Español</button>
</div>
<header>
  <h1>PROJECT SENTINEL</h1>
  <p class="subtitle" id="subtitle">THE OFFICIAL COMIC LIBRARY</p>
</header>
<main>
  <h2 id="heading">SELECT AN ISSUE</h2>
  <div class="library">
    <div class="comic">
      <img id="cover1" src="issue1-cover.png.png" alt="Project Sentinel Issue 1 cover">
      <h3 id="issue1">ISSUE #1</h3> <p id="title1">NEW BEGINNINGS</p>
      <a class="read" id="link1" href="reader.html?edition=issue1-en">READ COMIC</a>
    </div>
    <div class="comic">
      <img id="cover2" src="issue2-cover.png.png" alt="Project Sentinel Issue 2 Saltwater cover">
      <h3 id="issue2">ISSUE #2</h3>
      <p id="title2">SALTWATER</p>
      <a class="read" id="link2" href="reader.html?edition=issue2-en">READ COMIC</a>
    </div>
  </div>
</main>
<footer>PROJECT SENTINEL</footer>
<script>
  function setLanguage(lang) {
  const title2 = document.getElementById('title2');
  const title1 = document.getElementById('title1');

  if (title2) {
    title2.textContent = lang === 'en' ? 'SALTWATER' : 'AGUAS PROFUNDAS';
  }

  if (title1) {
    title1.textContent = lang === 'en' ? 'NEW BEGINNINGS' : 'NUEVOS COMIENZOS';
  }
  document.getElementById('cover1').src =
    lang === 'en' ? 'issue1-cover.png.png' : 'issue1-es/01.png';

  document.getElementById('cover2').src =
    lang === 'en' ? 'issue2-cover.png.png' : 'issue2-es/01.png';
  document.documentElement.lang = lang;
  document.getElementById('en').classList.toggle('active', lang === 'en');
  document.getElementById('es').classList.toggle('active', lang === 'es');
  document.getElementById('subtitle').textContent =
    lang === 'en' ? 'THE OFFICIAL COMIC LIBRARY' : 'LA BIBLIOTECA OFICIAL DE CÓMICS';
  document.getElementById('heading').textContent =
    lang === 'en' ? 'SELECT AN ISSUE' : 'SELECCIONA UN NÚMERO';
  document.getElementById('issue1').textContent =
    lang === 'en' ? 'ISSUE #1' : 'NÚMERO 1';
  document.getElementById('issue2').textContent =
    lang === 'en' ? 'ISSUE #2' : 'NÚMERO 2';
  document.getElementById('link1').textContent =
    lang === 'en' ? 'READ COMIC' : 'LEER CÓMIC';
  document.getElementById('link2').textContent =
    lang === 'en' ? 'READ COMIC' : 'LEER CÓMIC';
  document.getElementById('link1').href = 'reader.html?edition=issue1-' + lang;
  document.getElementById('link2').href = 'reader.html?edition=issue2-' + lang;
}
</script>
</body>
</html>
